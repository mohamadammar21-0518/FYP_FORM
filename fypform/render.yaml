services:
  - type: web
    name: fyp-attendance-form
    env: node
    plan: free
    rootDir: fypform
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fyp-attendance-db
          property: connectionString

databases:
  - name: fyp-attendance-db
    plan: free
    databaseName: fypform
